name: Clone ps1 MASTER

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source MASTER
        run: |
          git clone --depth 1 --branch MASTER https://github.com/PROMPT-A-THON-26/ps1.git /tmp/ps1

      - name: Replace repository contents
        run: |
          rsync -a --delete --exclude='.git' /tmp/ps1/ ./
          rm -f .github/workflows/clone-ps1.yml

      - name: Commit cloned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clone ps1 MASTER"
          git push origin HEAD:main
